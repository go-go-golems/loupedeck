name: loupedeck-provider
target:
  kind: xgoja
  output: dist/loupedeck-provider
packages:
  - id: loupedeck
    import: github.com/go-go-golems/loupedeck/pkg/xgoja/provider
    version: v0.0.0
    replace: ../../..
runtimes:
  main:
    modules:
      - package: loupedeck
        name: loupedeck/easing
        as: loupedeck/easing
      - package: loupedeck
        name: loupedeck/gfx
        as: loupedeck/gfx
commands:
  run:
    enabled: true
    runtime: main
